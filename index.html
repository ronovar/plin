<!DOCTYPE html>
<html>
<head>
<style>
label, input, button, p#info {
    font-size: 24px;
}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<script>

function setCookie(cname,cvalue,exdays)
{
var d = new Date();
d.setTime(d.getTime()+(exdays*24*60*60*1000));
var expires = "expires="+d.toGMTString();
document.cookie = cname+"="+cvalue+"; "+expires;
}

function getCookie(cname)
{
var name = cname + "=";
var ca = document.cookie.split(';');
for(var i=0; i<ca.length; i++) 
  {
  var c = ca[i].trim();
  if (c.indexOf(name)==0) return c.substring(name.length,c.length);
  }
return "";
}

</script>
</head>
<body onload=getCookie("stanjeod")>

<h1>Međimurje Plin - Izračun</h1>


  <label for="lblStanjeOD">STANJE OD:</label>
  <input type="number" id="stanjeod" name="stanjeod"><br><br>
  <label for="lblStanjeDO">STANJE DO:</label>
  <input type="number" id="stanjedo" name="stanjedo"><br><br>
  <button onclick="izracunaj()">Izračunaj</button>

<script>
if (getCookie("stanjeod")!="" && getCookie("stanjeod")!=null)
{ 
   var stanjeod = getCookie("stanjeod");  

   document.getElementById("stanjeod").value = stanjeod;
}
</script>


<p id="info"></p>

<script>
function izracunaj() {
  var stanjeod = document.getElementById("stanjeod").value;
  var stanjedo = document.getElementById("stanjedo").value;
  var stanje   = stanjedo - stanjeod;
 
  var energija = Math.round(stanje * 0.948678 * 11.170207);
  var iznos    = (((energija * 0.0522) + 1.73) * 1.05).toFixed(2);

  var subvencija = (energija * 0.0043).toFixed(2);

  var platiti  = (iznos - subvencija).toFixed(2);

  document.getElementById("info").innerHTML = "KOLIČINA: <b>" + stanje + " m3</b><br>ENERGIJA: <b>" + energija + " kWh</b></br>IZNOS: <b>€" + iznos + "</b><br>SUBVENCIJA: <b>-€" + subvencija + "</b><br><br>ZA PLATITI: <b>€" + platiti + "</b>";

 var stanjeod = document.getElementById("stanjeod").value;
   if (stanjeod!="" && stanjeod!=null) {
      setCookie("stanjeod",stanjeod,365);
   }
}
</script>

</body>
</html>
